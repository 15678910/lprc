name: Update data

# 원 통계가 월간·분기·연간이라 하루 1회면 충분하다.
# 기업 공시(사업보고서)는 연 1회 갱신되지만, 정정공시가 있을 수 있어 같이 돌린다.
#
# 필요한 시크릿 — Settings > Secrets and variables > Actions
#   DART_API_KEY  없으면 ④⑤⑥ 회사 목록이 비고 직접 입력만 가능      (opendart.fss.or.kr)
#   BOK_API_KEY   없으면 서울 아파트 실질가격·한국 분배지표가 빠짐    (ecos.bok.or.kr)
#   FRED_API_KEY  없으면 일부 미국 계열이 빠짐                        (fred.stlouisfed.org)
#   KOSIS_API_KEY 없으면 평균 가구원 수(1인당 주거부담 환산)가 빠짐   (kosis.kr)
# 넷 다 없어도 OECD 기반 블록(물가·노동몫·격차·임시직 비중)과
# 공공부문(⑩ 알리오)은 그대로 수집된다 — 알리오는 키가 필요 없다.
on:
  schedule:
    - cron: '0 1 * * *'      # 매일 KST 10:00 (UTC 01:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 두 수집기 모두 표준 라이브러리로 동작한다 — 설치할 의존성이 없다.
      # 예외가 하나 있다. money_macro_monitor 의 통화량 블록이 달러 환산 비중을
      # 낼 때만 yfinance 를 쓰는데, 없으면 그 비중만 빼고 나머지는 그대로 수집한다.
      # 환율 표시 하나 때문에 pandas·numpy 까지 끌고 오는 건 손해라 설치하지 않는다.
      # (로그의 "yfinance 없음" 경고는 정상 동작이다.)

      # 물가·임금·통화량·노동몫·가계소비 (+ ECOS 키가 있으면 서울 아파트·분배지표)
      - name: Collect macro data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python money_macro_monitor.py

      # 회사별 지불능력 (DART 직원현황 + 손익)
      # 실패해도 위 데이터는 살리기 위해 계속 진행한다.
      - name: Collect wage negotiation data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python wage_negotiation.py || echo "wage_negotiation had errors, continuing..."

      # 공공부문 (알리오) — 키가 필요 없다. 화면이 쓰는 JSON 을 그대로 부른다.
      # 알리오 화면 구조가 바뀌면 깨질 수 있어, 실패해도 앞의 데이터는 살린다.
      # 원인은 출력 JSON 의 diag 배열에 남는다.
      - name: Collect public sector data
        env:
          PYTHONIOENCODING: utf-8
        run: python public_sector.py || echo "public_sector had errors, continuing..."

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 원격이 앞서 있을 때 rebase 로 붙이면 반드시 충돌한다 — 생성물이라 양쪽이
          # 같은 줄(generated_at 등)을 다시 쓰기 때문이다. 실제로 두 실행이 겹쳐 실패했다.
          # 생성물에는 '병합'이라는 개념이 없다. 이번에 수집한 값이 언제나 옳으므로
          # 최신 원격 위에 그대로 얹어 다시 커밋한다.
          #
          # 생성물은 docs/*.json 뿐만이 아니다. 자료를 쪼개 두면서
          # docs/co/(업종별)·docs/ps/(공공부문 기능별) 아래로도 나간다.
          # 'docs/*.json' 글롭은 하위 폴더를 잡지 않으므로 디렉터리째 넣는다.
          # (그렇게 안 해서 docs/co 가 수동 커밋 이후 자동 갱신되지 않고 있었다.
          #  디렉터리로 넣으면 파일이 사라진 경우의 삭제도 함께 기록된다.)
          GEN="docs/co docs/ps"
          # 폴더가 없을 때 함수가 0이 아닌 값을 돌려주면 bash -e 가 스텝을 끊는다.
          # 마지막에 return 0 을 박아 둔다.
          save() { rm -rf /tmp/collected; mkdir -p /tmp/collected
                   cp docs/*.json /tmp/collected/ 2>/dev/null || true
                   for d in $GEN; do [ -d "$d" ] && cp -r "$d" /tmp/collected/; done
                   return 0; }
          restore() { cp /tmp/collected/*.json docs/ 2>/dev/null || true
                      for d in $GEN; do rm -rf "$d"
                        b=$(basename "$d")
                        [ -d "/tmp/collected/$b" ] && cp -r "/tmp/collected/$b" docs/; done
                      return 0; }
          for i in 1 2 3; do
            git add docs/*.json $GEN 2>/dev/null || true
            if git diff --cached --quiet 2>/dev/null; then
              echo "변경 없음 — 커밋할 것이 없다"
              exit 0
            fi
            git commit -m "Update data [automated]"
            if git push; then exit 0; fi
            echo "push 실패 (시도 $i) — 원격이 앞섰다. 최신 위에 이번 수집 결과를 다시 얹는다."
            save
            git fetch origin master
            git reset --hard origin/master
            restore
          done
          echo "3회 모두 실패 — 다음 예약 실행에서 다시 시도된다."
          exit 1
