name: Update data

# 원 통계가 월간·분기·연간이라 하루 1회면 충분하다.
# 기업 공시(사업보고서)는 연 1회 갱신되지만, 정정공시가 있을 수 있어 같이 돌린다.
on:
  schedule:
    - cron: '0 1 * * *'      # 매일 KST 10:00 (UTC 01:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 두 수집기 모두 표준 라이브러리만 쓴다 — 설치할 의존성이 없다.

      # 물가·임금·통화량·노동몫·가계소비 (+ ECOS 키가 있으면 서울 아파트·분배지표)
      - name: Collect macro data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python money_macro_monitor.py

      # 회사별 지불능력 (DART 직원현황 + 손익)
      # 실패해도 위 데이터는 살리기 위해 계속 진행한다.
      - name: Collect wage negotiation data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python wage_negotiation.py || echo "wage_negotiation had errors, continuing..."

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.json 2>/dev/null || true
          if git diff --cached --quiet 2>/dev/null; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update data [automated]"
          for i in 1 2 3; do
            if git push 2>/dev/null; then exit 0; fi
            git pull --rebase origin master
          done
